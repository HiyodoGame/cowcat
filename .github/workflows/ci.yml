# CI: lint + the full test suite on every push/PR, plus a guard on what
# `npm publish` would upload.
#
# The live checks under agent/test/live/ are deliberately NOT part of this: they
# need a configured provider / real API key (see agent/test/live/README.md) or a
# running MCP server, so they stay opt-in on a developer machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test · node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          # The product is developed and used on Windows (path handling, .cmd
          # shims, MCP stdio launch), so one Windows job is part of the gate.
          - os: windows-latest
            node: 22
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install (npm ci)
        run: npm ci
      - name: Lint + tests (pretest runs eslint)
        run: npm test

  package:
    name: package whitelist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check what npm publish would upload
        run: node tools/check-tarball.mjs
