# CI: four v2 packages, one gate each, and a publish whitelist.
#
# ── Why this is shaped the way it is ─────────────────────────────────────────
# This repository is PUBLIC, so GitHub Actions minutes are free on every runner.
# Every leg therefore runs on every non-draft PR:
#
#   packages/protocol          Linux, Node 22 — pure JS, no renderer and no kernel
#   packages/cowcat            Linux + Windows, Node 22 (macOS lives in ci-macos.yml,
#                              where the Seatbelt backend can be verified for real)
#   packages/tui               Linux + Windows, Node 26.4 — opentui ships a native
#                              core per platform, so the two runners answer different
#                              questions
#   packages/cli               Linux, Node 22 — the executable. Its interesting
#                              property is the build CHAIN: `file:` dependencies have
#                              to be built before it can compile at all
#   package whitelist          every non-draft PR — packs all four, installs the
#                              tarballs and runs `cowcat --version`
#   CI (macOS)                 every non-draft PR + every main push
#   draft PRs                  nothing — a draft cannot be merged, and
#                              `ready_for_review` re-triggers a full run
#
# Required checks are exactly the jobs that report on EVERY non-draft PR. That is
# the whole rule: a required check that only sometimes reports blocks every PR
# that skipped it.
#
# Linux legs are pinned to `ubuntu-24.04` (2026-10-17). `ubuntu-latest` starts
# moving to Ubuntu 26.04 on 2026-10-19 and completes by 2026-11-19
# (actions/runner-images#14748), so for weeks the same commit could land on either
# image. That matters here because this gate installs bubblewrap + an AppArmor
# profile, and when that fails the sandbox tests SKIP instead of failing — a moving
# image could switch coverage off while the required check stays green.
#
# The job `name:` fields still read `ubuntu-latest` on purpose: a required status
# check is matched by job NAME, so renaming them means updating the branch
# protection contexts in the same window, or every PR blocks on a check that can
# no longer report. `runs-on` is the truth; those names are legacy identifiers.
#
# Dropped on purpose: Node 20 (end-of-life 2026-04-30) and the legacy `agent/`
# suite (deleted in P8).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` is NOT a default type, and draft PRs skip the jobs below
    # — without this a PR promoted out of draft would never get a gate.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cowcat:
    # The v2 kernel. Cheap by construction: no sandbox, no network, and the suite
    # finishes in seconds, so the cost is checkout and setup. The single exception
    # to "no child processes" is test/lock-cross-process.test.ts, which spawns real
    # node processes on purpose: the session lock is a cross-process primitive, and
    # testing it in one process would not test the thing that matters.
    name: packages/cowcat · node 22 · ubuntu-latest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: packages/cowcat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/cowcat/package-lock.json
            packages/protocol/package-lock.json
      # The protocol is a file dependency, and npm links a directory — it does not install
      # its dependencies or build it. The host in this package is what implements its
      # `ProtocolHost` port (ADR-062 ③), so this leg does both itself, before `tsc` runs.
      - name: "Build the protocol package (file dependency)"
        run: |
          npm --prefix ../protocol ci
          npm --prefix ../protocol run build
      # bubblewrap is what the v2 system tier drives on Linux. Without it the sandbox
      # enforcement tests SKIP (with the probe's own classification as the reason), which
      # is honest but means this leg would stop covering the one thing only a real
      # kernel can prove.
      #
      # Ubuntu 23.10+ restricts unprivileged user namespaces via AppArmor, so bwrap fails
      # until the profile is loaded — the same fix our own preflight tells users about,
      # applied here so the documented path is exercised rather than assumed.
      - name: Install sandbox deps (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          sudo apt-get install -y apparmor-profiles 2>/dev/null || true
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict 2>/dev/null || true
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict 2>/dev/null || true
      - name: Install (npm ci)
        run: npm ci
      - name: Build, lint and test (pretest runs build + eslint)
        # The sandbox tests print the probe's own classification when they skip, so this
        # log already says whether bwrap was usable here.
        run: npm test
      # The one fact this leg exists to establish that a test cannot: whether the AppArmor
      # profile makes `--disable-userns` available. If `hardening` is empty here, this
      # runner's sandbox is measurably weaker and every run in the log says so in its
      # limitations — which is the intended degradation, not a failure.
      - name: Report the sandbox backend verdict
        run: |
          node --input-type=module -e "
          const { NodePlatform } = await import('./dist/src/index.js');
          const platform = new NodePlatform();
          console.log('platform:', platform.platform);
          console.log('verdicts:', JSON.stringify(platform.sandboxBackends()));
          "

  cowcat-windows:
    # Every non-draft PR, and a required check. It was main-only while the repo
    # was private and Windows billed at 2x (54s wall ≈ 1.8 billable minutes per
    # run, paid again on every PR); minutes are free now, and a v2 regression on
    # Windows should be caught before the merge rather than after it.
    name: packages/cowcat · node 22 · windows-latest
    runs-on: windows-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: packages/cowcat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/cowcat/package-lock.json
            packages/protocol/package-lock.json
      # Same reason as the Linux leg above: a file dependency is linked, not installed or
      # built, and this package now compiles against it.
      - name: "Build the protocol package (file dependency)"
        run: |
          npm --prefix ../protocol ci
          npm --prefix ../protocol run build
      - name: Install (npm ci)
        run: npm ci
      - name: Build, lint and test (pretest runs build + eslint)
        run: npm test

  protocol:
    # The seam package (ADR-062): JSON-RPC, transports, `serve` lifecycle. It runs on the
    # kernel's Node floor, not the renderer's, which is the whole reason it is a package
    # of its own. One leg is enough: it is pure JS, and the tui legs build it on both
    # platforms anyway (they consume it as a `file:` dependency).
    name: packages/protocol · node 22 · ubuntu-latest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: packages/protocol
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/protocol/package-lock.json
      - name: Install (npm ci)
        run: npm ci
      - name: Build, lint and test (pretest runs build + eslint)
        run: npm test

  tui:
    # Node 26 is opentui's floor, not ours (ADR-056): the kernel package stays on
    # Node 22, and this is the only place the frontend's floor is verified. The leg
    # runs unconditionally for the same reason the cowcat legs do — a leg that only
    # sometimes reports can never be a required check — and it is cheap: install,
    # a type-check, and two assertions about one rendered frame.
    name: packages/tui · node 26 · ubuntu-latest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: packages/tui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            packages/tui/package-lock.json
            packages/protocol/package-lock.json
      # The protocol is a file dependency, and npm links a directory — it does not
      # install its dependencies or build it (measured: 0 extra packages, a junction).
      # A consumer therefore has to do both itself, and this is that step.
      - name: "Build the protocol package (file dependency)"
        run: |
          npm --prefix ../protocol ci
          npm --prefix ../protocol run build
      - name: Install (npm ci)
        run: npm ci
      - name: Build, lint and test (pretest runs build + eslint)
        run: npm test

  tui-windows:
    # The platform-specific question, and a different fact from the Linux leg:
    # @opentui/core ships its native core as per-platform optional dependencies, so
    # resolving @opentui/core-win32-x64 successfully is its own result. Measured
    # locally on Node 26.12.0 (opentui.dll, 5.06 MB, one 40x6 frame in 12 ms); this
    # leg is what keeps that true on a machine nobody develops on.
    name: packages/tui · node 26 · windows-latest
    runs-on: windows-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: packages/tui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            packages/tui/package-lock.json
            packages/protocol/package-lock.json
      # Same reason as the Linux leg: a file dependency is linked, not installed or
      # built; `npm --prefix` is the one spelling that works on both platforms.
      - name: "Build the protocol package (file dependency)"
        run: |
          npm --prefix ../protocol ci
          npm --prefix ../protocol run build
      - name: Install (npm ci)
        run: npm ci
      - name: Build, lint and test (pretest runs build + eslint)
        run: npm test

  cli:
    # The executable (ADR-062 ③, ADR-065): the subcommand table, `serve` over the real
    # host, `run`, `sessions` and `doctor`. One leg, and the reason is what this leg
    # really checks — the CHAIN. `file:` dependencies are junctions, so the protocol and
    # the kernel have to be built here before the bin can even be compiled, and this is
    # the only leg where that order is exercised end to end.
    #
    # What it does not cover: the Windows side of its own spawn test. That is deliberate —
    # the protocol's spawn tests already run on both platforms inside the tui legs, and a
    # second Windows leg would buy the same answer twice.
    name: packages/cli · node 22 · ubuntu-latest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/cli/package-lock.json
            packages/cowcat/package-lock.json
            packages/protocol/package-lock.json
            packages/tui/package-lock.json
      - name: "Build the file dependencies (protocol → kernel → renderer)"
        # The chain, in dependency order, and it is the reason this leg exists: `file:`
        # dependencies are junctions, so npm installs and builds none of them. The renderer
        # is in the chain because the `tui` verb imports it (and its types), which is what
        # makes `cowcat tui` compile against the real entry rather than a hand-written shape.
        run: |
          npm --prefix ../protocol ci
          npm --prefix ../protocol run build
          npm --prefix ../cowcat ci
          npm --prefix ../cowcat run build
          npm --prefix ../tui ci
          npm --prefix ../tui run build
      - name: Install (npm ci)
        run: npm ci
      - name: Build, lint and test (pretest runs build + eslint)
        run: npm test

  package:
    name: package whitelist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the protocol package (file dependency)
        run: |
          npm --prefix packages/protocol ci
          npm --prefix packages/protocol run build
      - name: Build the kernel, renderer and executable
        run: |
          npm --prefix packages/cowcat ci
          npm --prefix packages/cowcat run build
          npm --prefix packages/tui ci
          npm --prefix packages/tui run build
          npm --prefix packages/cli ci
          npm --prefix packages/cli run build
      - name: Check what npm publish would upload, then install the tarballs
        run: node tools/check-tarball.mjs --install
