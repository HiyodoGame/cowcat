# CI (macOS) — the ONLY place the Seatbelt backend is verified for real, and the
# ONLY place the v2 shell resolution is verified on a POSIX host.
#
# It used to run on PRs touching the sandbox and never on main pushes, because
# macOS bills at 10x: measured 2026-10-16, 27 triggered runs cost 79 billable
# minutes (10% of that day's usage) while the wall time was ~20s. It was also
# deliberately outside branch protection, because a path-filtered check that
# only sometimes reports blocks every PR that skipped it.
#
# The repo is public now, so minutes are free on macOS runners too. Both
# constraints are gone, so this runs on EVERY non-draft PR and every main push,
# and it IS a required check: it reports every time, which is what makes a
# required check safe. That puts the Seatbelt enforcement assertions
# (test/sandbox-macos.test.mjs G1/G2/G3, private temp dir, `rm` still works) in
# the merge gate instead of in a log nobody reads.
#
# One job: the v2 package on macOS. macOS is the only place two questions can be
# answered for real — the Seatbelt backend actually applies a profile, and POSIX
# shell resolution picks /bin/bash rather than whichever shell the image prefers
# (docs/research/p2-shell-detection.md §3). The legacy suite that used to live here
# was deleted in P8.
#
# Draft PRs are excluded for the same reason as ci.yml: they cannot be merged.
# `workflow_dispatch` remains for re-running a specific case by hand.
#
# `macos-15`, not `macos-latest`: latest currently tracks macOS 26, where
# `sandbox-exec` itself still works but a shell can abort before it runs because
# it reads sysctls no profile has allowlisted (reported on the Cursor forum for
# zsh 5.9). Pinning keeps the image stable and the failure signal readable.
name: CI (macOS)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cowcat:
    # The v2 package on macOS. No scope check: a required check that skips on some
    # PRs blocks exactly those PRs, and the suite finishes in seconds.
    name: packages/cowcat · node 22 · macos-15
    runs-on: macos-15
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: packages/cowcat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/cowcat/package-lock.json
            packages/protocol/package-lock.json
      # A file dependency is linked, not installed or built (ADR-062), and the host in this
      # package implements the protocol's port — so the protocol is built here first.
      - name: "Build the protocol package (file dependency)"
        run: |
          npm --prefix ../protocol ci
          npm --prefix ../protocol run build
      - name: Install (npm ci)
        run: npm ci
      - name: Build, lint and test (pretest runs build + eslint)
        run: npm test
      # What this leg is really here for, printed where a reader of the log can see
      # it: which shell the v2 resolver picks on macOS, and whether the Seatbelt
      # probe really applies a profile here. It reads `dist/`, so it has to come
      # after the test step — `npm test` is what builds.
      - name: Report the resolved shell and sandbox verdict
        run: |
          node --input-type=module -e "
          const { NodePlatform } = await import('./dist/src/index.js');
          const p = new NodePlatform();
          console.log('shell:', JSON.stringify(p.resolveShell()));
          console.log('attempts:', JSON.stringify(p.shellAttempts()));
          console.log('backends:', JSON.stringify(p.sandboxBackends()));
          "