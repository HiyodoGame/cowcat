# CI (macOS) — the ONLY place the Seatbelt backend is verified for real.
#
# It used to run on PRs touching the sandbox and never on main pushes, because
# macOS bills at 10x: measured 2026-10-16, 27 triggered runs cost 79 billable
# minutes (10% of that day's usage) while the wall time was ~20s. It was also
# deliberately outside branch protection, because a path-filtered check that
# only sometimes reports blocks every PR that skipped it.
#
# The repo is public now, so minutes are free on macOS runners too. Both
# constraints are gone, so this runs on EVERY non-draft PR and every main push,
# and it IS a required check: it reports every time, which is what makes a
# required check safe. That puts the Seatbelt enforcement assertions
# (test/sandbox-macos.test.mjs G1/G2/G3, private temp dir, `rm` still works) in
# the merge gate instead of in a log nobody reads.
#
# Draft PRs are excluded for the same reason as ci.yml: they cannot be merged.
# `workflow_dispatch` remains for re-running a specific case by hand.
#
# `macos-15`, not `macos-latest`: latest currently tracks macOS 26, where
# `sandbox-exec` itself still works but a shell can abort before it runs because
# it reads sysctls no profile has allowlisted (reported on the Cursor forum for
# zsh 5.9). Pinning keeps the image stable and the failure signal readable.
name: CI (macOS)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test · node 22 · macos-15
    runs-on: macos-15
    timeout-minutes: 25
    # Same draft guard as ci.yml. On a push `github.event.pull_request.draft` is
    # null, so the first clause is what lets main pushes through.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install (npm ci)
        run: npm ci
      # No sandbox dependency to install: sandbox-exec ships with macOS. The
      # probe in src/sandbox/probe.js checks that it can actually apply a
      # profile (not just that the binary exists), and the enforcement tests
      # skip with that classification if it cannot.
      - name: Report the backend preflight
        # awk, not sed: renderInspect() puts section headers back to back with no
        # blank line between them, so a /^$/ terminator would either print to the
        # end of the output or nothing at all.
        run: node bin/cowcat.mjs doctor inspect | awk '/^\[sandbox\]/{f=1;next} /^\[/{f=0} f'
      # Separates "sandbox-exec rejected our profile" from "the command ran and
      # the rules were wrong". The test suite below can only report that the
      # sandbox produced nothing; this prints the exit code and stderr of the
      # sandbox exec itself, which is the difference between a broken profile
      # and a broken rule.
      - name: Seatbelt profile smoke test
        working-directory: .
        run: |
          node tools/seatbelt-smoke.mjs
          echo
          node tools/seatbelt-smoke.mjs --net
      - name: Lint + tests (pretest runs eslint)
        run: npm test